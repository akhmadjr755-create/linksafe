<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkSafe | Cyber Security Scanner</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2306101f'/%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%2300e5ff' stroke-width='2' opacity='0.3'/%3E%3Cpath d='M50 25 L70 35 V50 C70 65 50 80 50 80 C50 80 30 65 30 50 V35 L50 25 Z' fill='%2306101f' stroke='%2300e5ff' stroke-width='4' stroke-linejoin='round'/%3E%3Crect x='42' y='50' width='16' height='12' rx='2' fill='%2300e5ff'/%3E%3Cpath d='M45 50 V45 A5 5 0 0 1 55 45 V50' fill='none' stroke='%2300e5ff' stroke-width='3'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="floor-container" aria-hidden="true">
      <div class="floor-grid"></div>
      <div class="floor-wave floor-wave-a"></div>
      <div class="floor-wave floor-wave-b"></div>
      <div class="floor-wave floor-wave-c"></div>
    </div>
    <!-- 1. Latar Belakang Gradasi -->
    <div class="bg-gradient"></div>
    
    <!-- 2. Grid Tipis Latar Belakang -->
    <div class="cyber-grid"></div>

    <!-- 3. Grid Gelombang 3D (Hanya Desktop) -->
    <div class="floor-container">
        <div class="floor-grid"></div>
        <div class="floor-wave"></div>
    </div>

    <!-- 4. Logo Raksasa -->
    <div class="bg-giant-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <path d="M50 5 L90 25 V50 C90 80 50 95 50 95 C50 95 10 80 10 50 V25 L50 5 Z" fill="none" stroke-width="2"/>
            <circle cx="50" cy="50" r="45" fill="none" stroke-width="1" opacity="0.5"/>
            <rect x="42" y="50" width="16" height="12" rx="2" fill="rgba(0, 229, 255, 0.1)" stroke-width="2"/>
            <path d="M45 50 V45 A5 5 0 0 1 55 45 V50" fill="none" stroke-width="2"/>
        </svg>
    </div>

    <!-- 5. Konten Utama -->
    <div class="app-container">
        <header class="app-header">
            <div class="brand">
                <div class="logo-wrapper">
                    <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                        <rect width="100" height="100" rx="20" fill="#06101f"/>
                        <circle cx="50" cy="50" r="40" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.3"/>
                        <circle cx="50" cy="50" r="30" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.6"/>
                        <path d="M50 25 L70 35 V50 C70 65 50 80 50 80 C50 80 30 65 30 50 V35 L50 25 Z" fill="#06101f" stroke="#00e5ff" stroke-width="4" stroke-linejoin="round"/>
                        <rect x="42" y="50" width="16" height="12" rx="2" fill="#00e5ff"/>
                        <path d="M45 50 V45 A5 5 0 0 1 55 45 V50" fill="none" stroke="#00e5ff" stroke-width="3"/>
                        <circle cx="50" cy="56" r="2" fill="#06101f"/>
                    </svg>
                </div>
                <h1>LinkSafe<span>.</span></h1>
            </div>
            <p class="tagline">Sistem Deteksi Risiko URL & Phishing</p>
        </header>

        <main class="glass-panel">
            <div class="panel-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="panel-title">SCANNER_TERMINAL_V1.0</span>
            </div>
            <div class="panel-body">
                <div class="input-group">
                    <label for="url-input">TARGET URL:</label>
                    <div class="input-wrapper">
                        <span class="prefix">https://</span>
                        <input type="text" id="url-input" placeholder="masukkan-link-mencurigakan.com" autocomplete="off" spellcheck="false">
                    </div>
                </div>
                <button id="check-btn">
                    <span>INISIALISASI SCAN</span>
                    <div class="scan-line"></div>
                </button>
            </div>
        </main>

        <section id="result-container" class="glass-panel result-hidden">
            <div class="result-header">
                <h2>Hasil Analisis</h2>
                <div id="risk-badge"></div>
            </div>
            <ul id="reason-list"></ul>
            <div class="disclaimer">
                <span class="icon">⚠️</span>
                <p><b>Disclaimer:</b> Hasil ini berdasarkan analisis pola URL dan API eksternal.</p>
            </div>
        </section>

        <footer class="app-footer">
            <p>&copy; 2026 LinkSafe. Dirancang untuk keamanan siber Anda.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
