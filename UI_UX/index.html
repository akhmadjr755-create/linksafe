<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkSafe | Cyber Security Scanner</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2306101f'/%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%2300e5ff' stroke-width='2' opacity='0.3'/%3E%3Cpath d='M50 25 L70 35 V50 C70 65 50 80 50 80 C50 80 30 65 30 50 V35 L50 25 Z' fill='%2306101f' stroke='%2300e5ff' stroke-width='4' stroke-linejoin='round'/%3E%3Crect x='42' y='50' width='16' height='12' rx='2' fill='%2300e5ff'/%3E%3Cpath d='M45 50 V45 A5 5 0 0 1 55 45 V50' fill='none' stroke='%2300e5ff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- BACKGROUND SATU LAYAR: KOTA KUBUS PADAT, MENONJOL KE ARAH LAYAR -->
<canvas id="cube-canvas" aria-hidden="true"></canvas>
<div class="cyber-grid" aria-hidden="true"></div>
<div class="fx-center-glow" aria-hidden="true"></div>
<div class="fx-vignette" aria-hidden="true"></div>
<div class="fx-grain" aria-hidden="true"></div>

<button id="theme-toggle" class="theme-btn" aria-label="Ganti tema terang/gelap" aria-pressed="false">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
</button>

<div class="app-container">
    <header class="app-header entrance-1">
        <div class="brand">
            <div class="logo-wrapper">
                <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                    <rect class="lg-bg" width="100" height="100" rx="20"/>
                    <circle class="lg-ring-a" cx="50" cy="50" r="40" fill="none" stroke-width="2" opacity="0.3"/>
                    <circle class="lg-ring-b" cx="50" cy="50" r="30" fill="none" stroke-width="2" opacity="0.6"/>
                    <path class="lg-shield" d="M50 25 L70 35 V50 C70 65 50 80 50 80 C50 80 30 65 30 50 V35 L50 25 Z" stroke-width="4" stroke-linejoin="round"/>
                    <rect class="lg-lock" x="42" y="50" width="16" height="12" rx="2"/>
                    <path class="lg-shackle" d="M45 50 V45 A5 5 0 0 1 55 45 V50" fill="none" stroke-width="3"/>
                    <circle class="lg-hole" cx="50" cy="56" r="2"/>
                </svg>
            </div>
            <h1>LinkSafe<span>.</span></h1>
        </div>
        <p class="tagline">Sistem Deteksi Risiko URL &amp; Phishing</p>
    </header>

    <main class="glass-panel entrance-2">
        <div class="panel-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="panel-title">SCANNER_TERMINAL_V1.0</span>
        </div>
        <div class="panel-body">
            <div class="input-group">
                <label for="url-input">TARGET URL:</label>
                <div class="input-wrapper">
                    <span class="prefix">https://</span>
                    <input type="text" id="url-input" placeholder="masukkan-link-mencurigakan.com" autocomplete="off" spellcheck="false">
                </div>
            </div>
            <button id="check-btn">
                <span>INISIALISASI SCAN</span>
                <div class="scan-line"></div>
            </button>
        </div>
    </main>

    <section id="result-container" class="glass-panel result-hidden">
        <div class="result-header">
            <h2>Hasil Analisis</h2>
            <div id="risk-badge"></div>
        </div>
        <ul id="reason-list"></ul>
        <div class="disclaimer">
            <span class="icon">⚠️</span>
            <p><b>Disclaimer:</b> Hasil ini berdasarkan analisis pola URL dan API eksternal.</p>
        </div>
    </section>

    <footer class="app-footer entrance-3">
        <p>&copy; 2026 LinkSafe. Dirancang untuk keamanan siber Anda.</p>
    </footer>
</div>

<script type="module" src="/assets/js/main.js"></script>
<script src="animations.js"></script>
</body>
</html>
